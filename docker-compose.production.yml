services:
  agent-arsenal:
    build:
      context: ./integrations/agent-arsenal
    image: ghcr.io/divibisoul/soul-agent-arsenal:latest
    restart: unless-stopped
    init: true
    environment:
      AGENT_ARSENAL_EXECUTE: "true"
      AGENT_ARSENAL_TOKEN: "${SOUL_AGENT_ARSENAL_TOKEN:?SOUL_AGENT_ARSENAL_TOKEN must be set}"
      AGENT_ARSENAL_ROOT: /var/lib/soul-agent-arsenal
      AGENT_ARSENAL_PORT: "8090"
      AGENT_ARSENAL_COMMAND_TIMEOUT_MS: "20000"
    volumes:
      - agent_arsenal_cache:/var/lib/soul-agent-arsenal
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "node", "gateway.mjs", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  n07:
    image: ghcr.io/divibisoul/soul-n07-orquestrador:latest
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      N07_HTTP_ADDR: ":8080"
      SOUL_AGENT_ARSENAL_URL: "http://agent-arsenal:8090"
      SOUL_AGENT_ARSENAL_TOKEN: "${SOUL_AGENT_ARSENAL_TOKEN:?SOUL_AGENT_ARSENAL_TOKEN must be set}"
      STORACHA_GUPPY_BIN: "/usr/local/bin/guppy"
      STORACHA_DATA_DIR: "/var/lib/n07/storacha"
    volumes:
      - n07_storacha:/var/lib/n07/storacha
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  agent_arsenal_cache:
  n07_storacha:
