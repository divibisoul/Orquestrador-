services:
  n07:
    image: ghcr.io/divibisoul/orquestrador-:latest
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      N07_HTTP_ADDR: ":8080"
      STORACHA_GUPPY_BIN: "/usr/local/bin/guppy"
      STORACHA_DATA_DIR: "/var/lib/n07/storacha"
    volumes:
      - n07_storacha:/var/lib/n07/storacha
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  n07_storacha:
