[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "soul-n07-langgraph-bridge"
version = "0.1.0"
description = "Optional LangGraph planning bridge that delegates execution to the canonical N07 ingress."
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph==1.2.12",
]

[tool.setuptools]
py-modules = ["graph", "run"]
