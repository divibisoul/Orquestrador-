
services:
  nats:
    image: nats:2.11
    command: ["-js"]
    ports: ["4222:4222"]
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: soul, POSTGRES_USER: soul, POSTGRES_PASSWORD: soul-local-only}
    ports: ["5432:5432"]
    volumes: ["soul-pg:/var/lib/postgresql/data"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    volumes: ["./otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["4318:4318","4317:4317"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3001:3000"]
    depends_on: [prometheus]
  n01:
    build: {context: ../../.soul/repos/aeternum-core-29}
    command: ["npm","run","mesh:n01"]
    environment:
      SOUL_MESH_N02_URL: http://n02:3020
      SOUL_MESH_N03_URL: http://n03:3030
      SOUL_MESH_N04_URL: http://n04:3000
      SOUL_MESH_N05_URL: http://n05:3000
      SOUL_MESH_N06_URL: http://n06:3000
      SOUL_MESH_SECRET: \${SOUL_MESH_SECRET}
    ports: ["8080:8080"]
  n02:
    build: {context: ../../.soul/repos/Eternium-}
    command: ["npm","run","start"]
    environment:
      SOUL_MESH_N01_URL: http://n01:8080
      SOUL_MESH_N03_URL: http://n03:3030
      SOUL_MESH_N04_URL: http://n04:3000
      SOUL_MESH_N05_URL: http://n05:3000
      SOUL_MESH_N06_URL: http://n06:3000
      SOUL_MESH_N07_URL: http://n07:8080
      SOUL_MESH_HMAC_SECRET: \${SOUL_MESH_SECRET}
    ports: ["3020:3020"]
  n03:
    build: {context: ../../.soul/repos/nexus-aeternum-fusion}
    command: ["npm","run","dev","--","--host","0.0.0.0","--port","3030"]
    environment: {SOUL_MESH_HMAC_SECRET: \${SOUL_MESH_SECRET}}
    ports: ["3030:3030"]
  n04:
    build: {context: ../../.soul/repos/nextjs-ai-chatbots}
    command: ["pnpm","dev","--hostname","0.0.0.0","--port","3000"]
    environment:
      SOUL_MESH_TOKEN: \${SOUL_MESH_TOKEN}
      SOUL_MESH_N01_URL: http://n01:8080
      SOUL_MESH_N02_URL: http://n02:3020
      SOUL_MESH_N03_URL: http://n03:3030
      SOUL_MESH_N05_URL: http://n05:3000
      SOUL_MESH_N06_URL: http://n06:3000
      SOUL_MESH_N07_URL: http://n07:8080
    ports: ["3040:3000"]
  n05:
    build: {context: ../../.soul/repos/nextjs-ai-chatbot}
    command: ["pnpm","dev","--hostname","0.0.0.0","--port","3000"]
    environment:
      SOUL_MESH_TOKEN: \${SOUL_MESH_TOKEN}
      SOUL_MESH_N01_URL: http://n01:8080
      SOUL_MESH_N02_URL: http://n02:3020
      SOUL_MESH_N03_URL: http://n03:3030
      SOUL_MESH_N04_URL: http://n04:3000
      SOUL_MESH_N06_URL: http://n06:3000
      SOUL_MESH_N07_URL: http://n07:8080
    ports: ["3050:3000"]
  n06:
    build: {context: ../../.soul/repos/nextjs-ai-chatbot-2000}
    command: ["pnpm","dev","--hostname","0.0.0.0","--port","3000"]
    environment:
      SOUL_MESH_TOKEN: \${SOUL_MESH_TOKEN}
      SOUL_MESH_HMAC_SECRET: \${SOUL_MESH_SECRET}
      SOUL_MESH_N01_URL: http://n01:8080
      SOUL_MESH_N02_URL: http://n02:3020
      SOUL_MESH_N03_URL: http://n03:3030
      SOUL_MESH_N04_URL: http://n04:3000
      SOUL_MESH_N05_URL: http://n05:3000
      SOUL_MESH_N07_URL: http://n07:8080
    ports: ["3060:3000"]
  n07:
    build: {context: ../../.}
    command: ["go","run","./cmd/nexus"]
    environment:
      N07_HTTP_ADDR: :8080
      N07_MAX_REQUEST_BYTES: 2097152
      N07_BACKEND_TIMEOUT: 30s
      SOUL_MESH_HMAC_SECRET: \${SOUL_MESH_SECRET}
      SOUL_MESH_N01_URL: http://n01:8080
      SOUL_MESH_N02_URL: http://n02:3020
      SOUL_MESH_N03_URL: http://n03:3030
      SOUL_MESH_N04_URL: http://n04:3000
      SOUL_MESH_N05_URL: http://n05:3000
      SOUL_MESH_N06_URL: http://n06:3000
    ports: ["8087:8080"]
  sara:
    build: {context: ../../.soul/repos/SARA, dockerfile: deploy/Dockerfile.service}
    environment: {SARA_API_TOKEN: \${SARA_API_TOKEN}}
    ports: ["8090:8090"]
volumes:
  soul-pg:
