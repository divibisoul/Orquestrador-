name: N07 Executor Runner Validation

on:
  push:
    branches: [audit/2026-09-01-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner:
    name: N07 runner + diagnostics
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: FIRST EXECUTION STEP - capture runner state
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}"
          node --version
          npm --version
          go version
          test -n "${RUNNER_NAME:-}" || { echo "ERROR: GitHub runner was not provisioned."; exit 1; }
      - uses: actions/checkout@v4
      - name: Generate diagnostics
        run: node scripts/diagnostics.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n07-diagnostics
          path: .diagnostics/
          if-no-files-found: error

  e2e:
    name: N01 to N07 federation E2E
    needs: runner
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: FIRST EXECUTION STEP - capture runner state
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}"
          go version
          test -n "${RUNNER_NAME:-}" || { echo "ERROR: GitHub runner was not provisioned."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Restore E2E failure history
        uses: actions/cache/restore@v4
        with:
          path: .soul/e2e-history.json
          key: n07-e2e-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            n07-e2e-history-${{ github.ref_name }}-
            n07-e2e-history-
      - name: Run federation E2E
        run: go test ./mesh -run '^TestN01ToN07FederatesAcrossN04N05N06$' -count=1 -v
      - name: Run all 15 bidirectional pair checks
        run: go run ./scripts/e2e-validation.go
        env:
          SOUL_MESH_TOKEN: ${{ secrets.SOUL_MESH_TOKEN }}
          SOUL_MESH_N01_URL: ${{ secrets.SOUL_MESH_N01_URL }}
          SOUL_MESH_N02_URL: ${{ secrets.SOUL_MESH_N02_URL }}
          SOUL_MESH_N03_URL: ${{ secrets.SOUL_MESH_N03_URL }}
          SOUL_MESH_N04_URL: ${{ secrets.SOUL_MESH_N04_URL }}
          SOUL_MESH_N05_URL: ${{ secrets.SOUL_MESH_N05_URL }}
          SOUL_MESH_N06_URL: ${{ secrets.SOUL_MESH_N06_URL }}
      - name: Upload E2E failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n07-e2e-validation-report
          path: e2e-validation-report.json
          if-no-files-found: error
      - name: Upload E2E history snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n07-e2e-history
          path: .soul/e2e-history.json
          if-no-files-found: warn
      - name: Save E2E failure history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .soul/e2e-history.json
          key: n07-e2e-history-${{ github.ref_name }}-${{ github.run_id }}
