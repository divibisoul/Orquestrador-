name: N07 Executor Runner Validation

on:
  push:
    branches: [audit/2026-09-01-hardening, frente-3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner:
    name: N07 runner + diagnostics
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: FIRST EXECUTION STEP - capture runner state
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}"
          node --version
          npm --version
          go version
          test -n "${RUNNER_NAME:-}" || { echo "ERROR: GitHub runner was not provisioned."; exit 1; }
      - uses: actions/checkout@v4
      - name: Generate diagnostics
        run: node scripts/diagnostics.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n07-diagnostics
          path: .diagnostics/
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    name: N01 to N07 federation E2E
    needs: runner
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: FIRST EXECUTION STEP - capture runner state
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}"
          go version
          test -n "${RUNNER_NAME:-}" || { echo "ERROR: GitHub runner was not provisioned."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Restore E2E failure history
        uses: actions/cache/restore@v4
        with:
          path: .soul/e2e-history.json
          key: n07-e2e-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            n07-e2e-history-${{ github.ref_name }}-
            n07-e2e-history-
      - name: Verify named federation test exists
        shell: bash
        run: |
          set -euo pipefail
          expected='TestN01ToN07FederatesAcrossN04N05N06'
          found="$(go test ./mesh -list '^TestN01ToN07FederatesAcrossN04N05N06$' | grep -Fx "$expected" || true)"
          test "$found" = "$expected" || {
            echo "ERROR: REQUIRED TEST NOT FOUND in package mesh. Check file naming and build tags."
            echo "A zero-test PASS is not valid E2E evidence."
            exit 1
          }
      - name: Run federation E2E and prove execution
        shell: bash
        run: |
          set -uo pipefail
          expected='TestN01ToN07FederatesAcrossN04N05N06'
          timeout --signal=TERM 180s go test ./mesh -run "^${expected}$" -count=1 -v 2>&1 | tee .diagnostics-federation-test.log
          test_status=${PIPESTATUS[0]}
          if ! grep -q "=== RUN   ${expected}" .diagnostics-federation-test.log; then
            echo "ERROR: REQUIRED TEST FOUND BUT DID NOT EXECUTE: ${expected}"
            echo "The -count=1 run produced no execution marker."
            exit 1
          fi
          if ! grep -q -- "--- PASS: ${expected}" .diagnostics-federation-test.log; then
            echo "ERROR: REQUIRED TEST EXECUTED BUT DID NOT PASS: ${expected}"
            exit "${test_status:-1}"
          fi
          test "${test_status:-1}" -eq 0
      - name: Run all 15 bidirectional pair checks
        if: always()
        run: go run ./scripts/e2e-validation.go ./scripts/e2e-patterns.go
        env:
          SOUL_MESH_TOKEN: ${{ secrets.SOUL_MESH_TOKEN }}
          SOUL_MESH_N01_URL: ${{ secrets.SOUL_MESH_N01_URL }}
          SOUL_MESH_N02_URL: ${{ secrets.SOUL_MESH_N02_URL }}
          SOUL_MESH_N03_URL: ${{ secrets.SOUL_MESH_N03_URL }}
          SOUL_MESH_N04_URL: ${{ secrets.SOUL_MESH_N04_URL }}
          SOUL_MESH_N05_URL: ${{ secrets.SOUL_MESH_N05_URL }}
          SOUL_MESH_N06_URL: ${{ secrets.SOUL_MESH_N06_URL }}
      - name: Upload E2E failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n07-e2e-validation-report
          path: e2e-validation-report.json
          if-no-files-found: error
      - name: Upload federation execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n07-federation-execution-log
          path: .diagnostics-federation-test.log
          if-no-files-found: error
      - name: Upload E2E history snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n07-e2e-history
          path: .soul/e2e-history.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Save E2E failure history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .soul/e2e-history.json
          key: n07-e2e-history-${{ github.ref_name }}-${{ github.run_id }}
