name: rgo-trinity-mmd
on:
  push:
    branches: [rgo-trinity-mmd-2026-09-28]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Contract tests exercise N07 registration and pin metadata. They do
          # not need 32 public source worktrees; pinned-source execution is
          # covered by the dedicated source-verification workflow.
          submodules: false
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - run: go test ./rgo
      - run: go test ./orchestrator
