name: rgo-trinity-mmd
on:
  push:
    branches: [rgo-trinity-mmd-2026-09-28]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Avoid Actions' recursive submodule post-cleanup failure. The
          # dedicated repository script materializes only canonical top-level
          # source pins and classifies Autogenesis' nested HLE metadata without
          # mutating the upstream repository.
          submodules: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Materialize the exact pinned public-source worktrees
        run: node scripts/materialize-top-level-submodules.mjs
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - run: go test ./rgo
      - run: go test ./orchestrator
