name: rgo-trinity-mmd
on:
  push:
    branches: [rgo-trinity-mmd-2026-09-28]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Provider pin tests need top-level worktrees, not the parent checkout's HEAD.
          # Materialize only first-level submodules; never recurse through upstream datasets.
          # The adapter's integrity/probe tests verify the actual top-level source pins.
          # Do not recurse into any upstream's nested datasets.
          submodules: false
      - name: Materialize pinned top-level SOUL upstreams
        run: node scripts/materialize-top-level-submodules.mjs
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - run: go test ./rgo
      - run: go test ./orchestrator
