name: rgo-integration
on:
  push:
    branches: [rgo-integration-2026-09-28]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - run: go test ./rgo
      - run: go test ./orchestrator
