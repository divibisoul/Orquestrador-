name: rgo-trinity-mmd
on:
  push:
    branches: [rgo-trinity-mmd-2026-09-28]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Match the canonical N07 integration workflow: materialize first-level
      # public gitlinks explicitly, and repair incomplete nested dataset metadata
      # only in this ephemeral runner after the pinned nested SHA is verified.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Materialize pinned top-level upstream repositories
        run: node scripts/materialize-top-level-submodules.mjs
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - run: go test ./rgo
      - run: go test ./orchestrator
