name: rgo-trinity-mmd
on:
  push:
    branches: [rgo-trinity-mmd-2026-09-28]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # These Go checks probe the pinned first-level upstream repositories, so
      # keep those checkouts materialized through the tests. A nested dataset in
      # one upstream has incomplete .gitmodules metadata; deinitialize the
      # first-level worktrees after validation so checkout cleanup does not
      # recursively traverse that unrelated nested dataset.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - run: go test ./rgo
      - run: go test ./orchestrator
      - name: Deinitialize external worktrees after pinned revision checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in integrations/external/*; do
            if git config -f .gitmodules --get "submodule.$path.url" >/dev/null; then
              git submodule deinit --force -- "$path"
            fi
          done
