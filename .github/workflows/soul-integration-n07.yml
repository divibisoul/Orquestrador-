name: SOUL Integration CI - N07
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Materialize SOUL top-level submodules without recursion
        run: node scripts/materialize-top-level-submodules.mjs
      - name: Validate SOUL identity
        run: test -s SOUL_ECOSYSTEM.md
      - name: Validate submodules
        shell: bash
        run: |
          set -e
          if test -f .gitmodules; then
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | while read p; do test -e "$p"; done
          fi
      - name: Validate exact SOUL external submodule pins
        run: node scripts/validate-soul-external-submodules.mjs
      - name: Validate 16-repository registry
        if: github.event.repository.name == 'Orquestrador-'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('integrations/external-capabilities.json'))
          assert len(d['repositories']) == 16
          assert len(d.get('complementary_repositories', [])) == 6
          all_sources=d['repositories']+d['complementary_repositories']
          assert len(all_sources) == 22
          for x in all_sources:
              assert x['source'].startswith('https://github.com/')
              assert x['revision'] and x['targets']
          print('16/16 primary + 6/6 complementary = 22 external sources: VALID')
          PY
