name: SOUL External Ownership + Resident Contract CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate external ownership
        run: node scripts/validate-external-capability-ownership.mjs

      - name: Validate resident contract
        run: >
          node -e "const c=require('./integrations/resident-agent-contract.json');
          if(c.transport.protocol!=='soul-mesh/1'||c.transport.contractVersion!=='1.1.0'||c.interface.describe!=='mesh.resident.describe@1.0.0')
          process.exit(1);
          console.log('resident contract: VALID')"
