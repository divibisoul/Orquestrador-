name: SOUL External Ownership + Resident Contract CI

on:
  push:
    branches: [main]
    paths:
      - "integrations/external-capabilities.json"
      - "integrations/external-capability-ownership.json"
      - "integrations/resident-agent-contract.json"
      - "scripts/validate-external-capability-ownership.mjs"
      - "docs/SOUL_RESIDENT_AGENT_ARCHITECTURE.md"
      - ".github/workflows/external-ownership-resident-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "integrations/external-capabilities.json"
      - "integrations/external-capability-ownership.json"
      - "integrations/resident-agent-contract.json"
      - "scripts/validate-external-capability-ownership.mjs"
      - "docs/SOUL_RESIDENT_AGENT_ARCHITECTURE.md"
      - ".github/workflows/external-ownership-resident-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate external ownership
        run: node scripts/validate-external-capability-ownership.mjs

      - name: Validate resident contract
        run: node -e "const c=require('./integrations/resident-agent-contract.json'); if(c.transport.protocol!=='soul-mesh/1'||c.transport.contractVersion!=='1.1.0'||c.interface.describe!=='mesh.resident.describe@1.0.0') process.exit(1); console.log('resident contract: VALID')"
