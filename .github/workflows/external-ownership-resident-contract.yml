name: SOUL External Ownership + Resident Contract CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

# Keep only the newest validation per PR/branch. This workflow validates JSON
# ownership contracts and does not need to clone 31 upstream repositories.
concurrency:
  group: external-ownership-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate external ownership
        run: node scripts/validate-external-capability-ownership.mjs
      - name: Validate resident contract
        run: >
          node -e "const c=require('./integrations/resident-agent-contract.json');
          if(c.transport.protocol!=='soul-mesh/1'||c.transport.contractVersion!=='1.1.0'||c.interface.describe!=='mesh.resident.describe@1.0.0')
          process.exit(1);
          console.log('resident contract: VALID')"
