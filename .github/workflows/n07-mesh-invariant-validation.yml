name: N07 Mesh Invariant Validation

on:
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n07-mesh-invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mesh-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned LangGraph bridge
        run: python -m pip install -e integrations/langgraph

      - name: Check Go formatting for changed files
        run: test -z "$(gofmt -l mesh/peers.go mesh/peers_auth_retry_test.go)"

      - name: Vet Mesh package
        run: go vet ./mesh

      - name: Run Mesh regression suite
        run: go test ./mesh -count=1 -v

      - name: Run Mesh race tests
        run: go test -race ./mesh -count=1

      - name: Run LangGraph bridge tests
        run: python -m unittest discover -s integrations/langgraph -p 'test_*.py' -v

      - name: Reject false LangGraph adapter success
        run: python scripts/test_external_capability_adapter.py

      - name: Validate upstream-to-adapter registry
        run: node scripts/validate-external-adapters.mjs

      - name: Validate Python adapter syntax
        run: python -m py_compile scripts/external-capability-adapter.py scripts/test_external_capability_adapter.py scripts/crewai_runner.py scripts/metagpt_runner.py

      - name: Build all Go packages
        run: go build ./...

      - name: Run repository Go tests
        run: go test ./... -count=1
