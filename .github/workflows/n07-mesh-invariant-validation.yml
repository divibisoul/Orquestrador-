name: N07 Mesh Invariant Validation

on:
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n07-mesh-invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mesh-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Check Go formatting for changed files
        run: test -z "$(gofmt -l mesh/peers.go mesh/peers_auth_retry_test.go)"

      - name: Vet Mesh package
        run: go vet ./mesh

      - name: Run Mesh regression suite
        run: go test ./mesh -count=1 -v

      - name: Run Mesh race tests
        run: go test -race ./mesh -count=1

      - name: Build all Go packages
        run: go build ./...

      - name: Run repository Go tests
        run: go test ./... -count=1
