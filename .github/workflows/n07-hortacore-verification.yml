name: N07 HortaCore verification
on:
  push:
    branches:
      - "feat/reintegrate-hortacore-processors-2026-09-28"
  pull_request:
    branches: [main]
    paths:
      - "aeternum/hortacore.go"
      - "aeternum/hortacore_test.go"
      - "cmd/nexus/main.go"
      - ".github/workflows/n07-hortacore-verification.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Verify HortaCore tests
        run: go test ./aeternum -run 'TestCatalogIsCompleteAndNonDuplicated|TestHortaCoreDoesNotFabricateBlockedModuleExecution|TestHortaCoreUsesOnlyRegisteredNativeOperation' -count=1
      - name: Verify N07 build
        run: go build ./cmd/nexus
