name: GRF/GRCE Real SARA E2E

on:
  pull_request:
    paths:
      - 'grf/**'
      - 'grce/**'
      - 'integrations/grf/**'
      - 'integrations/soul-29-capability-fabric.json'
      - 'orchestrator/grce_ops.go'
      - 'orchestrator/grce_ops_test.go'
      - 'cmd/nexus/main.go'
      - 'backend/backend.go'
      - 'backend/nervo_vago.go'
      - 'backend/nervo_vago_test.go'
      - 'backend/sara_proxy.go'
      - '.github/workflows/grf-grce-real-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout N07
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Materialize SOUL top-level submodules without recursion
        run: node scripts/materialize-top-level-submodules.mjs

      - name: Checkout SARA
        uses: actions/checkout@v4
        with:
          repository: divibisoul/SARA
          ref: 90fe0c93af787cf2dba560992ef247e43460a94c
          path: .e2e/SARA
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SARA
        working-directory: .e2e/SARA
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Start SARA
        working-directory: .e2e/SARA
        env:
          SARA_API_TOKEN: e2e-sara-token-123456789
          SARA_HOST: 127.0.0.1
          SARA_PORT: 8090
        run: |
          nohup python -m sara.service.main > ../../sara-e2e.log 2>&1 &
          echo $! > ../../sara.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat ../../sara-e2e.log
          exit 1

      - name: Build N07
        run: go build -trimpath -o /tmp/n07-grce-e2e ./cmd/nexus

      - name: Start N07
        env:
          N07_APP_TOKEN: e2e-n07-token-123456789
          SARA_SERVICE_URL: http://127.0.0.1:8090
          SARA_SERVICE_TOKEN: e2e-sara-token-123456789
          SARA_REQUEST_TIMEOUT: 30s
        run: |
          nohup /tmp/n07-grce-e2e > /tmp/n07-grce-e2e.log 2>&1 &
          echo $! > /tmp/n07.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/n07-grce-e2e.log
          exit 1

      - name: Assert GRF discovery
        run: |
          curl -fsS -H 'Authorization: Bearer e2e-n07-token-123456789' -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/v1/execute -d '{"operation":"grf.describe@2.0.0","metadata":{"grf_sequence_index":"1"}}' | tee /tmp/grf.json
          python - <<'PY'
          import json
          outer=json.load(open('/tmp/grf.json'))
          raw=json.loads(outer['metadata']['system_binding_json'] if 'system_binding_json' in outer['metadata'] else outer['metadata']['soul29_fabric_json'])
          assert raw['framework']=='GRF' or raw['version']=='2.0'
          print('GRF discovery: PASS')
          PY

      - name: Assert 22-source federation
        run: |
          curl -fsS -H 'Authorization: Bearer e2e-n07-token-123456789' -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/v1/execute -d '{"operation":"external.federation.describe@1.0.0","metadata":{}}' | tee /tmp/federation.json
          python - <<'PY'
          import json
          outer=json.load(open('/tmp/federation.json'))
          raw=json.loads(next(v for k,v in outer['metadata'].items() if k.endswith('json')))
          assert raw['provider_count']==22
          print('22-source federation: PASS')
          PY

      - name: Execute real GRCE -> SARA cycle
        run: |
          curl -fsS -H 'Authorization: Bearer e2e-n07-token-123456789' -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/v1/execute -d '{"operation":"grce.sara.authoritative.execute@2.0.0","correlationId":"grce-e2e-001","metadata":{"grf_sequence_index":"1","grf_input_text":"preservar estado, rastreabilidade e autonomia"}}' | tee /tmp/grce-sara.json
          python - <<'PY'
          import json
          outer=json.load(open('/tmp/grce-sara.json'))
          m=outer['metadata']
          assert m['execution_mode']=='SARA_AUTHORITATIVE'
          assert m['epistemic_state']=='REAL'
          assert m['trace_hash'].startswith('sha256:')
          assert m['federated_context_hash'].startswith('sha256:')
          print('GRCE -> SARA authoritative: REAL')
          PY

      - name: Execute unified Nervo Vago path with ETR provenance
        run: |
          curl -fsS -H 'Authorization: Bearer e2e-n07-token-123456789' \
            -H 'Content-Type: application/json' \
            -X POST http://127.0.0.1:8080/v1/execute \
            -d '{"operation":"nervo-vago.event@1.0.0","correlationId":"nervo-e2e-001","metadata":{"sequence_index":"1","message_id":"nervo-msg-001","source":"N07.SuperGPU","target":"SARA","priority":"100","ttl":"5000","type":"supergpu.result","parent_hash":"sha256:parent","input_hash":"sha256:input","payload_json":"{\"ok\":true}"}}' \
            | tee /tmp/nervo-vago.json
          python - <<'PY'
          import json
          outer=json.load(open('/tmp/nervo-vago.json'))
          m=outer['metadata']
          payload=json.loads(m['nervo_vago_json'])
          assert outer['status']=='ok'
          assert m['epistemic_state']=='REAL'
          assert payload['etr_approved'] is True
          assert payload['provenance']['message_id']=='nervo-msg-001'
          print('Nervo Vago -> ETR -> Vagus: REAL')
          PY

      - name: Prove direct GRCE fails closed
        run: |
          set +e
          http_status="$(curl -sS -o /tmp/grce-direct.json -w '%{http_code}' -H 'Authorization: Bearer e2e-n07-token-123456789' -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/v1/execute -d '{"operation":"grce.cycle.execute@2.0.0","correlationId":"grce-direct-blocked","metadata":{"grf_sequence_index":"2"}}')"
          curl_status=$?
          cat /tmp/grce-direct.json
          test "$curl_status" -eq 0
          test "$http_status" = "400"
          grep -q 'GRCE_RUNTIME_HOOKS_NOT_BOUND' /tmp/grce-direct.json

      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/n07.pid || kill "$(cat /tmp/n07.pid)" || true
          test ! -f sara.pid || kill "$(cat sara.pid)" || true
          cat /tmp/n07-grce-e2e.log || true
          cat sara-e2e.log || true
