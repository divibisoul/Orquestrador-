name: Octacore Focused Gate

on:
  push:
    branches:
      - feat/octacore-system-processor-r1
  pull_request:
    branches:
      - main
    paths:
      - 'octacore/**'
      - 'hortacore/**'
      - 'mesh/**'
      - 'backend/**'
      - '.github/workflows/octacore-focused.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Gofmt
        run: |
          set -euo pipefail
          gofmt -w $(git ls-files '*.go')
          if git diff --quiet -- $(git ls-files '*.go'); then
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- $(git ls-files '*.go')
            git commit -m 'style(octacore): normalize Go formatting'
            git push origin "HEAD:${{ github.head_ref }}"
            exit 0
          fi
          git diff --exit-code -- $(git ls-files '*.go')
      - name: Vet Octacore HortaCore
        run: go vet ./octacore ./hortacore
      - name: Octacore HortaCore tests
        run: go test ./octacore ./hortacore -count=1
      - name: Octacore race tests
        run: go test -race ./octacore ./hortacore -count=1
      - name: Federated preflow tests
        run: go test ./octacore -run 'TestBuildFederatedPreJobs|TestFederatedContextCycle' -count=1
      - name: Full build
        run: go build ./...
