name: N07 Soul Mesh Secret Synchronization

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  sync:
    name: Synchronize SOUL_MESH_TOKEN to N01-N06
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: FIRST EXECUTION STEP - capture runner state
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}"
          node --version
          npm --version
          test -n "${RUNNER_NAME:-}" || { echo "ERROR: GitHub runner was not provisioned."; exit 1; }

      - uses: actions/checkout@v4

      - name: Pre-sync secret gate
        shell: bash
        run: node scripts/pre-sync-check.js
        env:
          SOUL_MESH_TOKEN: ${{ secrets.SOUL_MESH_TOKEN }}
          REPO_SECRETS_ADMIN_TOKEN: ${{ secrets.REPO_SECRETS_ADMIN_TOKEN }}

      - name: Upload pre-sync status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n07-pre-sync-status
          path: .diagnostics/pre-sync-status.json
          if-no-files-found: error

      - name: Install secret synchronization dependency
        run: npm install --no-save --no-package-lock libsodium-wrappers@0.7.15

      - name: Synchronize SOUL_MESH_TOKEN
        run: node scripts/secret-sync.js
        env:
          SOUL_MESH_TOKEN: ${{ secrets.SOUL_MESH_TOKEN }}
          REPO_SECRETS_ADMIN_TOKEN: ${{ secrets.REPO_SECRETS_ADMIN_TOKEN }}
          GITHUB_API_URL: https://api.github.com
          SYNC_SECRET_NAME: SOUL_MESH_TOKEN
          TARGET_REPOSITORIES: divibisoul/aeternum-core-29,divibisoul/Eternium-,divibisoul/nexus-aeternum-fusion,divibisoul/nextjs-ai-chatbots,divibisoul/nextjs-ai-chatbot,divibisoul/nextjs-ai-chatbot-2000

      - name: Upload synchronization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n07-secret-sync-report
          path: .diagnostics/secret-sync-report.json
          if-no-files-found: error
