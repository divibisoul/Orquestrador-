name: SOUL Mesh Secret Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SOUL_MESH_TOKEN: ${{ secrets.SOUL_MESH_TOKEN }}
      GH_TOKEN: ${{ secrets.SOUL_SYNC_GITHUB_TOKEN }}
    steps:
      - name: Validate synchronization credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOUL_MESH_TOKEN:-}" || { echo 'SOUL_MESH_TOKEN is not configured in N07.' >&2; exit 1; }
          test -n "${GH_TOKEN:-}" || { echo 'SOUL_SYNC_GITHUB_TOKEN is not configured in N07.' >&2; exit 1; }

      - name: Synchronize SOUL_MESH_TOKEN to N01-N06
        shell: bash
        env:
          REPOSITORIES: |
            divibisoul/aeternum-core-29
            divibisoul/Eternium-
            divibisoul/nexus-aeternum-fusion
            divibisoul/nextjs-ai-chatbots
            divibisoul/nextjs-ai-chatbot
            divibisoul/nextjs-ai-chatbot-2000
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            echo "Synchronizing SOUL_MESH_TOKEN -> $repo"
            if ! printf '%s' "$SOUL_MESH_TOKEN" | gh secret set SOUL_MESH_TOKEN --repo "$repo"; then
              echo "FAILED: $repo" >&2
              failed=1
            else
              echo "OK: $repo"
            fi
          done <<< "$REPOSITORIES"
          exit "$failed"

      - name: Verify secret presence without reading the value
        shell: bash
        env:
          REPOSITORIES: |
            divibisoul/aeternum-core-29
            divibisoul/Eternium-
            divibisoul/nexus-aeternum-fusion
            divibisoul/nextjs-ai-chatbots
            divibisoul/nextjs-ai-chatbot
            divibisoul/nextjs-ai-chatbot-2000
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            if gh secret list --repo "$repo" --json name --jq '.[] | select(.name == "SOUL_MESH_TOKEN") | .name' | grep -qx 'SOUL_MESH_TOKEN'; then
              echo "VERIFIED: $repo"
            else
              echo "MISSING: $repo" >&2
              failed=1
            fi
          done <<< "$REPOSITORIES"
          exit "$failed"
