name: GRF + GRCE gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/grf-grce-upgrade-wave-2026-10-06

permissions:
  contents: write

jobs:
  grf-grce:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w grf grce
          if ! git diff --quiet -- grf grce; then
            git config user.name "SOUL GRF Formatter"
            git config user.email "actions@users.noreply.github.com"
            git add grf grce
            git commit -m "style(grf): gofmt GRF and GRCE packages"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
          test -z "$(gofmt -l grf grce)"
      - name: focused tests
        run: go test ./grf ./grce
      - name: package build
        run: go test ./grf ./grce -run '^$'
