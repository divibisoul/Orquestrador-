name: SOUL canonical capability authority

on:
  push:
    paths:
      - "soul-capability-authority.json"
      - "scripts/verify-soul-capability-authority.mjs"
      - ".github/workflows/soul-canonical-capability-authority.yml"
  pull_request:
    paths:
      - "soul-capability-authority.json"
      - "scripts/verify-soul-capability-authority.mjs"
      - ".github/workflows/soul-canonical-capability-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact capability ownership against live main sources
        run: node scripts/verify-soul-capability-authority.mjs
