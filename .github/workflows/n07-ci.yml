name: N07 Orquestrador CI

on:
  push:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/n07-ci.yml'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/n07-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: n07-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Normalize Go formatting
        run: gofmt -w $(git ls-files '*.go')
      - name: Commit formatting normalization
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'All tracked Go files are already gofmt-clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.go'
          git commit -m 'style(n07): normalize Go formatting'
          git push origin HEAD:main

  verify:
    if: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert checkout source
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git branch --show-current)" != ""
          git show HEAD:neural/network.go | sha256sum
          sed -n '24p' neural/network.go
          ! grep -nF '<- clip' neural/network.go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Format check
        run: |
          set -euo pipefail
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            echo 'The following Go files require gofmt:'
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Build
        run: go build ./...
