name: N07 Orquestrador CI

on:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/n07-ci.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/n07-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Format changed Go files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            files="$(git diff-tree --no-commit-id --name-only --diff-filter=ACMRTUXB -r "$HEAD_SHA" -- '*.go')"
          else
            files="$(git diff --name-only --diff-filter=ACMRTUXB "$BASE_SHA" "$HEAD_SHA" -- '*.go')"
          fi
          if [[ -z "$files" ]]; then
            echo "No changed Go files to format-check."
            exit 0
          fi
          unformatted="$(printf '%s\n' "$files" | xargs -r gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "The following changed Go files are not gofmt-formatted:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Build
        run: go build ./...
