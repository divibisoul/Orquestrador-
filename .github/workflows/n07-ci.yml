name: N07 Orquestrador CI

on:
  push:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'supabase/migrations/**'
      - 'soul-nuclei.json'
      - 'SOUL_MASTER_ENGINEERING_CONTRACT.md'
      - 'scripts/soul-architectural-integrity.mjs'
      - 'scripts/soul-live-source-audit.mjs'
      - 'scripts/generate-crossfront-state.mjs'
      - 'scripts/external-capability-adapter.py'
      - 'scripts/crewai_runner.py'
      - 'scripts/metagpt_runner.py'
      - 'scripts/validate-soul-external-submodules.mjs'
      - 'scripts/materialize-top-level-submodules.mjs'
      - 'integrations/external-adapters.json'
      - 'integrations/external-capabilities.json'
      - 'integrations/external/**'
      - 'config/soul-external-recovery-manifest.json'
      - '.github/workflows/n07-ci.yml'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'supabase/migrations/**'
      - 'soul-nuclei.json'
      - 'SOUL_MASTER_ENGINEERING_CONTRACT.md'
      - 'scripts/soul-architectural-integrity.mjs'
      - 'scripts/soul-live-source-audit.mjs'
      - 'scripts/generate-crossfront-state.mjs'
      - 'scripts/external-capability-adapter.py'
      - 'scripts/crewai_runner.py'
      - 'scripts/metagpt_runner.py'
      - 'scripts/validate-soul-external-submodules.mjs'
      - 'scripts/materialize-top-level-submodules.mjs'
      - 'scripts/validate-external-adapters.mjs'
      - 'scripts/validate-external-capability-ownership.mjs'
      - 'scripts/validate-soul-29-grf.mjs'
      - 'grf/**'
      - 'grce/**'
      - 'integrations/grf/**'
      - 'integrations/soul-29-capability-fabric.json'
      - 'integrations/external-capabilities.json'
      - 'integrations/external-adapters.json'
      - 'integrations/external-capability-ownership.json'
      - 'integrations/external/**'
      - 'config/soul-external-recovery-manifest.json'
      - '.gitmodules'
      - 'Dockerfile'
      - '.github/workflows/n07-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: n07-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Materialize top-level SOUL submodules without unsafe recursion
        run: node scripts/materialize-top-level-submodules.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOUL_GITHUB_AUDIT_TOKEN: ${{ secrets.SOUL_GITHUB_AUDIT_TOKEN }}
      SOUL_REQUIRE_REMOTE_PROVENANCE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Materialize top-level SOUL submodules without unsafe recursion
        run: node scripts/materialize-top-level-submodules.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Forbid recursive upstream submodule checkout
        run: |
          set -euo pipefail
          if grep -R -nE 'submodules:[[:space:]]*recursive' .github/workflows scripts/*.sh; then
            echo 'Recursive upstream submodule traversal is forbidden; materialize only registered top-level federation sources.'
            exit 1
          fi
          if grep -nE 'git submodule (sync|update).*--recursive|git -C "\$ROOT" submodule (sync|update).*--recursive' scripts/soul-local-up.sh; then
            echo 'Local bootstrap must not recurse into upstream-internal submodules.'
            exit 1
          fi

      - name: Architectural integrity
        run: node scripts/soul-architectural-integrity.mjs

      - name: Validate Soul-29 and GRF invariants
        run: node scripts/validate-soul-29-grf.mjs

      - name: Live source integrity
        run: node scripts/soul-live-source-audit.mjs

      - name: Declarative crossfront generation
        run: node scripts/generate-crossfront-state.mjs

      - name: Verify generated diagnostics are tracked
        run: |
          set -euo pipefail
          test -s SOUL-ARCHITECTURAL-INTEGRITY.json
          test -s SOUL-LIVE-SOURCE-AUDIT.json
          test -s SOUL-CROSSFRONT-EVIDENCE.json
          test -s SOUL-SYSTEM-CROSSFRONT-STATE.md

      - name: Upload Integrity Reports
        uses: actions/upload-artifact@v4
        with:
          name: soul-integrity-report
          path: |
            SOUL-ARCHITECTURAL-INTEGRITY.json
            SOUL-LIVE-SOURCE-AUDIT.json
          if-no-files-found: error

  verify:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Materialize top-level SOUL submodules without unsafe recursion
        run: node scripts/materialize-top-level-submodules.mjs

      - name: Assert declarative SOUL source
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('soul-nuclei.json','utf8'));if(m.system!=='SOUL')throw new Error('SOUL_MATRIX_SYSTEM_INVALID');if(m.canonicalMesh?.protocol!=='soul-mesh/1')throw new Error('SOUL_MATRIX_PROTOCOL_INVALID');if(m.canonicalMesh?.contractVersion!=='1.1.0')throw new Error('SOUL_MATRIX_CONTRACT_INVALID');for(const id of ['N01','N02','N03','N04','N05','N06','N07'])if(!m.nuclei?.[id])throw new Error('SOUL_MATRIX_NUCLEUS_MISSING:'+id);for(const [id,n] of Object.entries(m.nuclei)){if(id!=='N07'&&(typeof n.sourceRef!=='string'||!/^[0-9a-f]{40}$/.test(n.sourceRef)))throw new Error('SOUL_MATRIX_SOURCE_REF_INVALID:'+id);if(!Array.isArray(n.adjacentPeers))throw new Error('SOUL_MATRIX_ADJACENCY_MISSING:'+id)};if(m.hardware?.simulation!==false||m.hardware?.realHardwareOnly!==true)throw new Error('SOUL_MATRIX_HARDWARE_POLICY_INVALID');console.log('SOUL declarative source verified.');"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Normalize Go formatting for verification workspace
        run: |
          set -euo pipefail
          gofmt -w $(git ls-files '*.go')
          git diff --check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Backend regression
        run: go test ./backend -run 'Test(Web3Storage|Supabase|Server|Intent)' -count=1

      - name: Mesh regression suite
        run: go test ./mesh -count=1 -v

      - name: Assert federation E2E test is integration-only and has no peer doubles
        run: |
          set -euo pipefail
          test -f mesh/n01_n07_federation_e2e_test.go
          grep -q '^//go:build integration$' mesh/n01_n07_federation_e2e_test.go
          if grep -qE 'httptest\.NewServer|e2e\.n04|e2e\.n05|e2e\.n06' mesh/n01_n07_federation_e2e_test.go; then
            echo 'synthetic federation peer evidence detected'
            exit 1
          fi

      - name: Real federation E2E when configured
        env:
          SOUL_MESH_HMAC_SECRET: ${{ secrets.SOUL_MESH_HMAC_SECRET }}
          SOUL_MESH_N04_URL: ${{ secrets.SOUL_MESH_N04_URL }}
          SOUL_MESH_N05_URL: ${{ secrets.SOUL_MESH_N05_URL }}
          SOUL_MESH_N06_URL: ${{ secrets.SOUL_MESH_N06_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SOUL_MESH_HMAC_SECRET" ] || [ -z "$SOUL_MESH_N04_URL" ] || [ -z "$SOUL_MESH_N05_URL" ] || [ -z "$SOUL_MESH_N06_URL" ]; then
            echo 'REAL_MESH_E2E: BLOCKED_ENV — required endpoint/secret secrets are not configured; no online proof is claimed.'
            exit 0
          fi
          go test -tags integration ./mesh -run '^TestN07FederatesToRealN04N05N06NativeCapabilities$' -count=1 -v

  container:
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Materialize top-level SOUL submodules without unsafe recursion
        run: node scripts/materialize-top-level-submodules.mjs

      - name: Build production image
        run: docker build --pull --tag n07-orquestrador:ci .

      - name: Inspect image without starting the server
        run: |
          set -euo pipefail
          docker image inspect n07-orquestrador:ci >/dev/null
          test "$(docker run --rm --entrypoint /bin/sh n07-orquestrador:ci -c 'test -x /app/n07 && test -x /usr/local/bin/guppy && test -x /usr/bin/python3 && test -s /app/config/soul-external-runtime-attestation.json && echo ok')" = ok

      - name: Production external federation smoke
        run: |
          set -euo pipefail
          docker run -d --rm --name n07-external-smoke -p 18082:8080 -e N07_APP_TOKEN=ci n07-orquestrador:ci
          trap 'docker rm -f n07-external-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS             -H 'Authorization: Bearer ci'             -H 'Content-Type: application/json'             -X POST http://127.0.0.1:18082/execute             -d '{"operation":"external.federation.describe@1.0.0","metadata":{}}'             | tee /tmp/external-federation.json
          grep -q '"provider_count":22' /tmp/external-federation.json
          curl -fsS             -H 'Authorization: Bearer ci'             -H 'Content-Type: application/json'             -X POST http://127.0.0.1:18082/execute             -d '{"operation":"external.langgraph.probe@1.0.0","metadata":{}}'             | tee /tmp/langgraph-probe.json
          grep -q '"state":"PASS"' /tmp/langgraph-probe.json
          grep -q '"source_present":true' /tmp/langgraph-probe.json
