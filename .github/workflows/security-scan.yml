name: Security

on:
  push:
    branches: [main, recovery/consolidation, integration/soul-six-nuclei, feature/trinity-fundamental-v1, feature/trinity-production-hardening-v1, feature/nexus-runtime-hardening-batch1, feature/nexus-finalization-v1, feature/readiness-dashboard]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestrator-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Compile before security analysis
        run: |
          set -euo pipefail
          go vet ./...
          go build ./...
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: Verify gosec version
        run: gosec -version
      - name: Go vulnerability scan
        shell: bash
        run: |
          set -euo pipefail
          rm -f gosec-report.json gosec.log
          gosec -no-fail -fmt json -out gosec-report.json ./... 2>&1 | tee gosec.log

          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("gosec-report.json").read_text())
          issues = report.get("Issues") or []
          unsuppressed = [
              issue for issue in issues
              if not issue.get("NoSec") and not issue.get("Suppressions")
          ]
          print(f"gosec unsuppressed findings: {len(unsuppressed)}")
          if unsuppressed:
              raise SystemExit(1)

          errors = report.get("Golang errors") or {}
          allowed = (
              "could not import google.golang.org/grpc",
          )
          unknown = []
          for package_errors in errors.values():
              for error in package_errors:
                  text = json.dumps(error, sort_keys=True)
                  if not any(marker in text for marker in allowed):
                      unknown.append(text)

          if unknown:
              print("gosec unknown processing errors:")
              for error in unknown:
                  print(error)
              raise SystemExit(1)

          if errors:
              print("gosec reported only the known grpc SSA/type-analysis limitation; go vet/build above remain mandatory gates.")
          PY
      - name: Upload security diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-diagnostics-${{ github.run_id }}
          path: |
            gosec-report.json
            gosec.log
          if-no-files-found: ignore
