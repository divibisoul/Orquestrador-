name: Security

on:
  push:
    branches: [main, recovery/consolidation, integration/soul-six-nuclei, feature/trinity-fundamental-v1, feature/trinity-production-hardening-v1, feature/nexus-runtime-hardening-batch1, feature/nexus-finalization-v1, feature/readiness-dashboard]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestrator-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
      - name: Go vulnerability scan
        run: gosec ./...
