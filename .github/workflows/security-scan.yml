name: Security

on:
  push:
    branches: [main, recovery/consolidation, integration/soul-six-nuclei, feature/trinity-fundamental-v1, feature/trinity-production-hardening-v1, feature/nexus-runtime-hardening-batch1, feature/nexus-finalization-v1, feature/readiness-dashboard]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Go vulnerability scan
        uses: securego/gosec@v2.22.8
        with:
          args: ./...
