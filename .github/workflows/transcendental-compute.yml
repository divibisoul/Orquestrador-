name: Transcendental Compute Engine

on:
  push:
    paths:
      - 'compute/transcendental/**'
      - 'config/compute.yaml'
      - 'go.mod'
      - '.github/workflows/transcendental-compute.yml'
  pull_request:
    paths:
      - 'compute/transcendental/**'
      - 'config/compute.yaml'
      - 'go.mod'
      - '.github/workflows/transcendental-compute.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false
      - name: Vet
        run: go vet ./compute/transcendental/...
      - name: Test isolated package
        run: go test ./compute/transcendental/...
      - name: Race test
        run: go test -race ./compute/transcendental/...
      - name: Build all Go packages
        run: go build ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
