name: SOUL 25 Capability Upgrade - N07

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 34-repository / 25-upstream augmentation contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('integrations/soul-25-augmentation.json'))
          assert d['external_provider_count'] == 25
          assert len(d['external_providers']) == 25
          assert d['soul_peer_count'] == 9
          assert len(d['soul_peers']) == 9
          assert d['native_authority'] == 'preserved'
          for p in d['external_providers']:
              assert p['id'] and p['capabilities']
              assert p['access'] == 'N07 canonical federation'
              assert p['structural_state'] == 'REAL'
              assert p['runtime_state'] == 'PROJECTED'
              assert p['requires_adapter'] is True
          assert d['total_repository_count'] == 34\n          print('SOUL-34 / 25-UPSTREAM AUGMENTATION CONTRACT: PASS')
          PY
      - name: Run N07 capability upgrade tests
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test orchestration, Mesh and Octacore
        run: go test ./backend ./orchestrator ./mesh ./octacore
