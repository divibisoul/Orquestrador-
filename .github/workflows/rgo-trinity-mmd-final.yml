name: rgo-trinity-mmd-final
on:
  push:
    branches: [rgo-trinity-mmd-2026-09-29-final]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Materialize SOUL top-level submodules without recursion
        run: node scripts/materialize-top-level-submodules.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test ./rgo
      - run: go test ./orchestrator
