name: SOUL primordial essence and composition continuity
on:
  push:
    branches:
      - "feat/primordial-essence-composition-ledger-2026-09-29"
  pull_request:
    branches: [main]
    paths:
      - "soul-nuclei.json"
      - "docs/SOUL_ARCHITECTURE_LIVE.md"
      - "scripts/verify-primordial-composition.mjs"
      - ".github/workflows/primordial-composition.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-primordial-composition.mjs
          node scripts/verify-primordial-essence.mjs
      - run: go test ./composition
