name: N07 Soul Mesh Secret Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read

jobs:
  validate:
    name: Validate N01-N06 Soul Mesh secret state
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: FIRST EXECUTION STEP - capture runner state
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}"
          node --version
          npm --version
          test -n "${RUNNER_NAME:-}" || { echo "ERROR: GitHub runner was not provisioned."; exit 1; }
          test -n "${REPO_SECRETS_ADMIN_TOKEN:-}" || { echo "ERROR: REPO_SECRETS_ADMIN_TOKEN is not configured."; exit 1; }
        env:
          REPO_SECRETS_ADMIN_TOKEN: ${{ secrets.REPO_SECRETS_ADMIN_TOKEN }}

      - uses: actions/checkout@v4

      - name: Validate target secrets
        run: npm exec --yes --package=libsodium-wrappers -- node scripts/secret-validator.js
        env:
          REPO_SECRETS_ADMIN_TOKEN: ${{ secrets.REPO_SECRETS_ADMIN_TOKEN }}
          GITHUB_API_URL: https://api.github.com
          SYNC_SECRET_NAME: SOUL_MESH_TOKEN
          MAX_SECRET_AGE_HOURS: 36
          TARGET_REPOSITORIES: divibisoul/aeternum-core-29,divibisoul/Eternium-,divibisoul/nexus-aeternum-fusion,divibisoul/nextjs-ai-chatbots,divibisoul/nextjs-ai-chatbot,divibisoul/nextjs-ai-chatbot-2000

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .diagnostics/secret-validator-report.json
          {
            echo '## SOUL_MESH_TOKEN validation'
            cat .diagnostics/secret-validator-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n07-secret-validation-report
          path: .diagnostics/secret-validator-report.json
          if-no-files-found: error
