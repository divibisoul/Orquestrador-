name: Aeternum Functional Authority Crossfront

on:
  pull_request:
    paths:
      - "contracts/aeternum-functional-authority.json"
      - "scripts/verify-aeternum-functional-authority.mjs"
      - ".github/workflows/aeternum-functional-authority-crossfront.yml"
  push:
    branches:
      - main
      - "feat/**"
      - "recovery/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify N01 Aeternum authority projection
        run: node scripts/verify-aeternum-functional-authority.mjs
