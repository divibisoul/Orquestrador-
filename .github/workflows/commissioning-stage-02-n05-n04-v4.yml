name: SOUL Commissioning Stage 2 v4 - N05 N04

on:
  push:
    paths:
      - ".github/workflows/commissioning-stage-02-n05-n04-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOUL_MESH_HMAC_SECRET: ci-stage-02-secret-32-bytes-minimum
      SOUL_MESH_TOKEN: ci-stage-02-token
      AUTH_SECRET: ci-stage-auth-secret
      N04_URL: http://127.0.0.1:3000
      N05_URL: http://127.0.0.1:3001

    steps:
      - uses: actions/checkout@v4

      - name: Checkout N04 canonical HMAC revision
        uses: actions/checkout@v4
        with:
          repository: divibisoul/nextjs-ai-chatbots
          ref: 0ae0d90d12370cf1dd5751ce4565816ceb648eab
          path: runtime/n04

      - name: Checkout N05 canonical HMAC revision
        uses: actions/checkout@v4
        with:
          repository: divibisoul/nextjs-ai-chatbot
          ref: 9ff923279616e4db89de50a6e63df2ae31a44b5a
          path: runtime/n05

      - run: corepack enable

      - name: Install N04
        working-directory: runtime/n04
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install N05
        working-directory: runtime/n05
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Start N04
        working-directory: runtime/n04
        run: node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3000 > /tmp/n04.log 2>&1 &

      - name: Start N05
        working-directory: runtime/n05
        run: node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3001 > /tmp/n05.log 2>&1 &

      - name: Wait for readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            c04=$(curl -sS -o /tmp/n04-ready.json -w '%{http_code}' "$N04_URL/api/ready" || true)
            c05=$(curl -sS -o /tmp/n05-ready.json -w '%{http_code}' "$N05_URL/api/ready" || true)
            if [ "$c04" = "200" ] && [ "$c05" = "200" ]; then
              cat /tmp/n04-ready.json
              cat /tmp/n05-ready.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/n04.log
          cat /tmp/n05.log
          exit 1

      - name: Discovery
        run: |
          set -euo pipefail
          curl -fsS -H 'Authorization: Bearer ci-stage-02-token' "$N04_URL/api/soul-mesh" > /tmp/n04-discovery.json
          curl -fsS -H 'Authorization: Bearer ci-stage-02-token' "$N05_URL/api/soul-mesh" > /tmp/n05-discovery.json
          node -e "const a=require('/tmp/n04-discovery.json'); const b=require('/tmp/n05-discovery.json'); if(a.nucleus!=='N04'||!a.declaredCapabilities.includes('context-orchestration'))process.exit(1); if(b.nucleus!=='N05')process.exit(1); console.log(JSON.stringify({state:'REAL',n04:a.nucleus,n05:b.nucleus}))"

      - name: Native hops policy payload retry
        run: node scripts/commission-stage-02-n05-n04.mjs

      - name: Inject route failure
        env:
          N04_URL: http://127.0.0.1:39999
        run: |
          set +e
          node scripts/commission-stage-02-n05-n04.mjs >/tmp/stage02-failure.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "FAIL: expected injected N04 route failure"
            exit 1
          fi
          echo "REAL: N04 route failure detected"

      - name: Recover and recompose
        run: |
          set -euo pipefail
          node scripts/commission-stage-02-n05-n04.mjs
          cat >/tmp/HANDOFF_N05_N04.json <<'EOF'
          {
            "stage":"N05↔N04",
            "evidenceState":"REAL",
            "commissioned":true,
            "correlationId":"stage02-root-correlation",
            "criteriaRequired":["DISCOVERY","CAPABILITY","AUTHENTICATED_DELEGATION","CORRELATION","NATIVE_EXECUTION","FAILURE_INJECTION","RECOVERY","COMPOSITION","PROVENANCE"],
            "revisions":{"N04":"0ae0d90d12370cf1dd5751ce4565816ceb648eab","N05":"9ff923279616e4db89de50a6e63df2ae31a44b5a"},
            "provenance":"GitHub Actions runtime evidence; no synthetic success"
          }
          EOF
          cat /tmp/HANDOFF_N05_N04.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-n05-n04-stage-02-v4
          path: |
            /tmp/HANDOFF_N05_N04.json
            /tmp/n04.log
            /tmp/n05.log
            /tmp/stage02-failure.log
