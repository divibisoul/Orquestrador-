name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true
      - name: Verify Go runtime
        run: go version
      - name: Benchmark suite
        run: go test ./... -bench=. -run '^$' -count=1
