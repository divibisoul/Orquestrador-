name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Verify Go runtime
        run: go version
      - name: Benchmark suite
        run: go test ./... -bench=. -run '^$' -count=1
