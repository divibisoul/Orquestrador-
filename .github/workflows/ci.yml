name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check 'google-genai>=1.0.0,<2.0.0'
      - name: Python Gemini provider smoke test
        run: python -m py_compile core/superagi/generator/providers/base.py core/superagi/generator/providers/gemini.py core/neural_fabric/router.py api/gemini.py
      - name: Normalize Go formatting
        run: gofmt -w .
      - name: Vet
        run: go vet ./...
      - name: Unit and race tests
        run: go test ./... -count=1 -race
