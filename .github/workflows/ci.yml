name: CI

on:
  push:
    branches:
      - main
      - recovery/consolidation
      - integration/soul-six-nuclei
      - feature/trinity-fundamental-v1
      - feature/trinity-production-hardening-v1
      - feature/nexus-runtime-hardening-batch1
      - feature/nexus-finalization-v1
      - feature/readiness-dashboard
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestrator-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Go diagnostics and validation
        shell: bash
        run: |
          set -euo pipefail
          go version
          go mod tidy
          gofmt -w .
          go vet ./... | tee /tmp/vet.log
          go build ./... | tee /tmp/build.log
          go test ./... -count=1 -race | tee /tmp/test.log
          test -s go.sum
      - name: Upload Go diagnostics and resolved modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-diagnostics-${{ github.run_id }}
          path: |
            /tmp/*.log
            go.mod
            go.sum
          if-no-files-found: ignore

  python-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Gemini SDK
        run: python3 -m pip install --disable-pip-version-check 'google-genai>=1.0.0,<2.0.0'
      - name: Python adapter syntax check
        run: python3 -m py_compile core/superagi/generator/providers/base.py core/superagi/generator/providers/gemini.py core/neural_fabric/router.py api/gemini.py
