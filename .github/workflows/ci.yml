name: CI

on:
  push:
    branches: [main, recovery/consolidation]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Normalize Go formatting
        run: gofmt -w . 2> /tmp/gofmt.log || true
      - name: Vet
        run: go vet ./... 2>&1 | tee /tmp/vet.log
      - name: Build
        run: go build ./... 2>&1 | tee /tmp/build.log
      - name: Unit and race tests
        run: go test ./... -count=1 -race 2>&1 | tee /tmp/test.log
      - name: Upload Go diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-recovery-diagnostics
          path: /tmp/*.log
          if-no-files-found: ignore

  python-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check 'google-genai>=1.0.0,<2.0.0'
      - name: Python adapter syntax check
        run: python -m py_compile core/superagi/generator/providers/base.py core/superagi/generator/providers/gemini.py core/neural_fabric/router.py api/gemini.py
