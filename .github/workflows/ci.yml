name: CI

on:
  push:
    branches: [main, recovery/consolidation]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Go diagnostics and validation
        shell: bash
        run: |
          set +e
          : > /tmp/gofmt.log
          : > /tmp/vet.log
          : > /tmp/build.log
          : > /tmp/test.log
          gofmt -w . > /tmp/gofmt.log 2>&1
          fmt_status=$?
          go vet ./... > /tmp/vet.log 2>&1
          vet_status=$?
          go build ./... > /tmp/build.log 2>&1
          build_status=$?
          go test ./... -count=1 -race > /tmp/test.log 2>&1
          test_status=$?
          cat /tmp/gofmt.log /tmp/vet.log /tmp/build.log /tmp/test.log
          if [ "$fmt_status" -ne 0 ] || [ "$vet_status" -ne 0 ] || [ "$build_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            echo "Go validation failed: format=$fmt_status vet=$vet_status build=$build_status test=$test_status"
            exit 1
          fi

      - name: Upload Go diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-recovery-diagnostics
          path: /tmp/*.log
          if-no-files-found: ignore

  python-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check 'google-genai>=1.0.0,<2.0.0'
      - name: Python adapter syntax check
        run: python -m py_compile core/superagi/generator/providers/base.py core/superagi/generator/providers/gemini.py core/neural_fabric/router.py api/gemini.py
