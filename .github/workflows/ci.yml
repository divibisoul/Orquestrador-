name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Normalize Go formatting
        run: gofmt -w .
      - name: Vet
        run: go vet ./...
      - name: Unit and race tests
        run: go test ./... -count=1 -race
